spring.application.name=random_major

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/fakejobdetectordb
spring.data.mongodb.database=fakejobdetectordb

# Server Port
server.port=8081

# ── LIME Microservice ────────────────────────────────────────
lime.service.url=http://localhost:5002
lime.num-features=10
lime.output-format=json
lime.timeout-ms=10000

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Caffeine cache for LIME explanations
lime.cache.max-size=500
lime.cache.ttl-minutes=60

# ── OpenCorporate API Configuration ──────────────────────────────
# Get your API key from: https://opencorporates.com/api
# IMPORTANT: Use environment variable in production: export OPENCORPORATE_API_KEY=your_key
opencorporate.api-url=https://api.opencorporates.com/v0.4
opencorporate.api-key=${OPENCORPORATE_API_KEY:}
company.verification.use-fallback=true


# ── SerpAPI Configuration (for hybrid real-time verification) ────
# Get your API key from: https://serpapi.com
# IMPORTANT: Use environment variable in production: export SERPAPI_API_KEY=your_key
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.enabled=true

# ── Spring Actuator (exposes /actuator/metrics for monitoring) ──
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# ── Logging ──
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.example.random_major=DEBUG

